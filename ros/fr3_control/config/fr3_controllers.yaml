# Native FR3 Cartesian impedance controller loaded by controller_manager.
fr3_cartesian_impedance_controller:
    # Plugin exported by this package.
    type: fr3_control/CartesianImpedanceController
    # Launch-substituted prefix shared by hardware handles and joint names.
    arm_id: $(arg arm_id)
    
    # Controlled joints, in kinematic-chain order.
    joint_names:
        - $(arg arm_id)_joint1
        - $(arg arm_id)_joint2
        - $(arg arm_id)_joint3
        - $(arg arm_id)_joint4
        - $(arg arm_id)_joint5
        - $(arg arm_id)_joint6
        - $(arg arm_id)_joint7

    # Frame attached to published commanded-pose and error diagnostics.
    base_frame: $(arg arm_id)_link0
    # Publish diagnostics once every N controller update cycles.
    diagnostic_decimation: 10
